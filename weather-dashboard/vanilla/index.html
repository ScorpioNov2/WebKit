<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            width: 300px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .search-box input:focus {
            outline: none;
            transform: scale(1.05);
        }

        .search-box button {
            padding: 12px 30px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #ff5252;
        }

        .current-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .weather-icon {
            font-size: 100px;
        }

        .weather-info h2 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .weather-info p {
            font-size: 1.2em;
            color: #666;
            margin: 5px 0;
        }

        .temperature {
            font-size: 3.5em;
            font-weight: bold;
            color: #667eea;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        .detail-card h3 {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .detail-card p {
            font-size: 1.8em;
            color: #333;
            font-weight: bold;
        }

        .forecast {
            margin-top: 40px;
        }

        .forecast h3 {
            color: white;
            font-size: 1.8em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-10px);
        }

        .forecast-card h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .forecast-card .icon {
            font-size: 50px;
            margin: 10px 0;
        }

        .forecast-card .temp {
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
        }

        .forecast-card .condition {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .current-weather {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .weather-info h2 {
                font-size: 1.8em;
            }

            .temperature {
                font-size: 2.5em;
            }

            .header h1 {
                font-size: 2em;
            }

            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                value="London"
            >
            <button onclick="searchWeather()">Search</button>
            <button onclick="getLocationWeather()">📍 My Location</button>
        </div>

        <div id="errorContainer"></div>
        <div id="loadingContainer"></div>
        <div id="weatherContainer"></div>
    </div>

    <script>
        const OPENMETEO_API = 'https://api.open-meteo.com/v1/forecast';
        const GEOCODING_API = 'https://geocoding-api.open-meteo.com/v1/search';

        const weatherIcons = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
            45: '🌫️', 48: '🌫️',
            51: '🌧️', 53: '🌧️', 55: '🌧️',
            61: '🌧️', 63: '⛈️', 65: '⛈️',
            71: '❄️', 73: '❄️', 75: '❄️',
            77: '❄️', 80: '🌧️', 81: '⛈️', 82: '⛈️',
            85: '❄️', 86: '❄️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
        };

        function showLoading() {
            document.getElementById('loadingContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Fetching weather data...</p>
                </div>
            `;
        }

        function hideLoading() {
            document.getElementById('loadingContainer').innerHTML = '';
        }

        function showError(message) {
            document.getElementById('errorContainer').innerHTML = `
                <div class="error">${message}</div>
            `;
            setTimeout(() => {
                document.getElementById('errorContainer').innerHTML = '';
            }, 5000);
        }

        async function geocodeCity(city) {
            try {
                const response = await fetch(
                    `${GEOCODING_API}?name=${city}&count=1&language=en&format=json`
                );
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    throw new Error('City not found');
                }

                return {
                    latitude: data.results[0].latitude,
                    longitude: data.results[0].longitude,
                    name: data.results[0].name,
                    country: data.results[0].country
                };
            } catch (error) {
                throw new Error(`Failed to find city: ${error.message}`);
            }
        }

        async function fetchWeatherData(latitude, longitude, cityName, countryName) {
            try {
                showLoading();

                const response = await fetch(
                    `${OPENMETEO_API}?` +
                    `latitude=${latitude}&` +
                    `longitude=${longitude}&` +
                    `current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&` +
                    `daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&` +
                    `timezone=auto`
                );

                const data = await response.json();
                hideLoading();

                displayWeather(data, cityName, countryName);
            } catch (error) {
                hideLoading();
                showError(`Error fetching weather: ${error.message}`);
            }
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Foggy',
                51: 'Drizzle',
                53: 'Drizzle',
                55: 'Heavy drizzle',
                61: 'Rain',
                63: 'Rain',
                65: 'Heavy rain',
                71: 'Snow',
                73: 'Snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Rain showers',
                81: 'Rain showers',
                82: 'Rain showers',
                85: 'Snow showers',
                86: 'Snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm',
                99: 'Thunderstorm'
            };
            return descriptions[code] || 'Unknown';
        }

        function displayWeather(data, cityName, countryName) {
            const current = data.current;
            const daily = data.daily;
            const timezone = data.timezone;

            const weatherCode = current.weather_code;
            const icon = weatherIcons[weatherCode] || '🌤️';
            const description = getWeatherDescription(weatherCode);

            let html = `
                <div class="current-weather">
                    <div class="weather-main">
                        <div class="weather-icon">${icon}</div>
                        <div class="weather-info">
                            <h2>${cityName}, ${countryName}</h2>
                            <p class="temperature">${Math.round(current.temperature_2m)}°C</p>
                            <p>${description}</p>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-card">
                            <h3>Feels Like</h3>
                            <p>${Math.round(current.temperature_2m)}°C</p>
                        </div>
                        <div class="detail-card">
                            <h3>Humidity</h3>
                            <p>${current.relative_humidity_2m}%</p>
                        </div>
                        <div class="detail-card">
                            <h3>Wind Speed</h3>
                            <p>${Math.round(current.wind_speed_10m)} km/h</p>
                        </div>
                        <div class="detail-card">
                            <h3>Timezone</h3>
                            <p>${timezone}</p>
                        </div>
                    </div>
                </div>
            `;

            html += '<div class="forecast"><h3>5-Day Forecast</h3><div class="forecast-grid">';

            for (let i = 0; i < Math.min(5, daily.time.length); i++) {
                const date = new Date(daily.time[i]);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const weatherCode = daily.weather_code[i];
                const icon = weatherIcons[weatherCode] || '🌤️';
                const description = getWeatherDescription(weatherCode);
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);

                html += `
                    <div class="forecast-card">
                        <h4>${dayName}</h4>
                        <div class="icon">${icon}</div>
                        <div class="temp">${maxTemp}° / ${minTemp}°</div>
                        <div class="condition">${description}</div>
                    </div>
                `;
            }

            html += '</div></div>';

            document.getElementById('weatherContainer').innerHTML = html;
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();

            if (!city) {
                showError('Please enter a city name');
                return;
            }

            try {
                const location = await geocodeCity(city);
                await fetchWeatherData(
                    location.latitude,
                    location.longitude,
                    location.name,
                    location.country
                );
            } catch (error) {
                showError(error.message);
            }
        }

        function getLocationWeather() {
            showLoading();

            if (!navigator.geolocation) {
                hideLoading();
                showError('Geolocation is not supported by your browser');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;

                    try {
                        const response = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
                        );
                        const geoData = await response.json();
                        const cityName = geoData.address.city || geoData.address.town || 'Your Location';
                        const countryName = geoData.address.country || '';

                        await fetchWeatherData(latitude, longitude, cityName, countryName);
                    } catch (error) {
                        hideLoading();
                        showError('Failed to get location name');
                    }
                },
                (error) => {
                    hideLoading();
                    showError(`Location error: ${error.message}`);
                }
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            searchWeather();
        });

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });
    </script>
</body>
</html>
